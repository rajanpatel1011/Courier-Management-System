# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/courier_db
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate — schema from entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true

# Legacy seed data (runs after Hibernate creates/updates tables)
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# Server Configuration
server.port=8080

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.suffix=.html
spring.thymeleaf.prefix=classpath:/templates/

# Security Configuration
spring.security.user.name=admin
spring.security.user.password=admin123

# Application Configuration
app.name=Courier Management System
app.version=1.0.0
# Public URL embedded in QR codes (set to your host in production/Docker)
app.public-base-url=http://localhost:8080
app.qr.refresh-interval-seconds=15
