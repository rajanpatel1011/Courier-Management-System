# H2 development profile
# Activate with --spring.profiles.active=dev or SPRING_PROFILES_ACTIVE=dev

spring.datasource.url=jdbc:h2:mem:courierdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Use H2-specific dialect for JPA in dev
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable Flyway for H2 dev because current migrations are MySQL-specific
spring.flyway.enabled=false

# H2 console for local development
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Alternative in-memory URL for fast ephemeral dev (uncomment to use):
# spring.datasource.url=jdbc:h2:mem:courierdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
