<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
    <h1>Track Result</h1>
    <div th:if="${errorMessage}" class="alert alert-danger">
        <span th:text="${errorMessage}"></span>
    </div>
    <div th:if="${courier}">
        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title" th:text="${courier.consignmentNo}"></h5>
                <p class="card-text">Status: <strong th:text="${courier.status}"></strong></p>
                <p class="card-text">Shipper: <strong th:text="${courier.shipperName}"></strong></p>
                <p class="card-text">Receiver: <strong th:text="${courier.receiverName}"></strong></p>
                <a th:href="@{/track/q/{no}(no=${courier.consignmentNo})}" class="btn btn-success">Live QR Tracking</a>
                <a th:href="@{/tracking/history/consignment/{consignmentNo}(consignmentNo=${courier.consignmentNo})}" class="btn btn-primary">View Tracking History</a>
                <img th:src="@{/track/q/{no}/qr.png(no=${courier.consignmentNo})}" alt="QR code" width="120" height="120" class="mt-3 d-block"/>
            </div>
        </div>
    </div>
</div>
</body>
</html>
