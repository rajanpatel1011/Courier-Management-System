<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offices in City</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
    <h1>Offices in <span th:text="${city}"></span></h1>
    <table class="table table-bordered table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Office Name</th>
            <th>Address</th>
            <th>Phone</th>
            <th>Contact Person</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="office : ${offices}">
            <td th:text="${office.id}"></td>
            <td th:text="${office.officeName}"></td>
            <td th:text="${office.address}"></td>
            <td th:text="${office.phoneNumber}"></td>
            <td th:text="${office.contactPerson}"></td>
        </tr>
        <tr th:if="${offices.empty}">
            <td colspan="5" class="text-center">No offices found for this city.</td>
        </tr>
        </tbody>
    </table>
    <a href="/offices" class="btn btn-secondary">Back to Offices</a>
</div>
</body>
</html>
