<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offices</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Offices</h1>
        <a href="/offices/add" class="btn btn-success">Add Office</a>
    </div>

    <table class="table table-bordered table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Office Name</th>
            <th>City</th>
            <th>Phone</th>
            <th>Contact Person</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="office : ${offices}">
            <td th:text="${office.id}"></td>
            <td th:text="${office.officeName}"></td>
            <td th:text="${office.city}"></td>
            <td th:text="${office.phoneNumber}"></td>
            <td th:text="${office.contactPerson}"></td>
            <td>
                <a th:href="@{/offices/{id}(id=${office.id})}" class="btn btn-sm btn-info">View</a>
                <a th:href="@{/offices/{id}/edit(id=${office.id})}" class="btn btn-sm btn-secondary">Edit</a>
                <form th:action="@{/offices/{id}/delete(id=${office.id})}" method="post" style="display:inline-block;">
                    <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                </form>
            </td>
        </tr>
        <tr th:if="${offices.empty}">
            <td colspan="6" class="text-center">No offices found.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
