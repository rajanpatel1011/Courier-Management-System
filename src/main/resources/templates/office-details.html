<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
    <h1>Office Details</h1>
    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title" th:text="${office.officeName}"></h5>
            <p><strong>Address:</strong> <span th:text="${office.address}"></span></p>
            <p><strong>City:</strong> <span th:text="${office.city}"></span></p>
            <p><strong>Phone:</strong> <span th:text="${office.phoneNumber}"></span></p>
            <p><strong>Office Timing:</strong> <span th:text="${office.officeTiming}"></span></p>
            <p><strong>Contact Person:</strong> <span th:text="${office.contactPerson}"></span></p>
        </div>
    </div>
    <a href="/offices" class="btn btn-secondary">Back to Offices</a>
</div>
</body>
</html>
