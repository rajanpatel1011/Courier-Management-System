<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivered Couriers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
    <h1>Delivered Couriers</h1>
    <table class="table table-bordered table-striped">
        <thead>
            <tr>
                <th>ID</th>
                <th>Consignment No</th>
                <th>Shipper</th>
                <th>Receiver</th>
                <th>Booking Date</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="courier : ${couriers}">
                <td th:text="${courier.id}"></td>
                <td th:text="${courier.consignmentNo}"></td>
                <td th:text="${courier.shipperName}"></td>
                <td th:text="${courier.receiverName}"></td>
                <td th:text="${courier.bookingDate}"></td>
                <td>
                    <a th:href="@{/couriers/{id}(id=${courier.id})}" class="btn btn-sm btn-info">View</a>
                </td>
            </tr>
            <tr th:if="${couriers.empty}">
                <td colspan="6" class="text-center">No delivered couriers found.</td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
