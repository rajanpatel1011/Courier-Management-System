<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/layout :: html-head('Manage Couriers')}"></head>
<body class="bg-light">

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar Navigation -->
            <div th:replace="~{layout/layout :: sidebar('couriers')}"></div>

            <!-- Main Panel Content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 main-content">
                <!-- Top Header Fragment -->
                <div th:replace="~{layout/layout :: admin-header(${session.user_name}, ${session.user_type})}"></div>

                <!-- Page Alert Messages -->
                <div th:if="${successMessage}" class="alert alert-success bg-success bg-opacity-10 text-success border-0 rounded-3 p-3 mb-4" role="alert">
                    <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${successMessage}">Success</span>
                </div>
                <div th:if="${errorMessage}" class="alert alert-danger bg-danger bg-opacity-10 text-danger border-0 rounded-3 p-3 mb-4" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${errorMessage}">Error</span>
                </div>

                <!-- Content Title & Actions -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3 class="fw-bold text-dark mb-0">Courier Shipments</h3>
                    <a href="/couriers/add" class="btn btn-modern btn-modern-primary d-flex align-items-center gap-2 py-2">
                        <i class="bi bi-plus-lg"></i> Add New Shipment
                    </a>
                </div>

                <!-- Modern Database Table -->
                <div class="glass-card border border-white border-opacity-60 bg-white shadow-sm p-4 overflow-hidden">
                    <div class="table-responsive">
                        <table class="table-modern">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Consignment No</th>
                                    <th>Shipper</th>
                                    <th>Receiver</th>
                                    <th>Booking Date</th>
                                    <th class="text-center">Status</th>
                                    <th class="text-end">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="courier : ${couriers}">
                                    <td class="fw-bold text-secondary" th:text="${courier.id}">1</td>
                                    <td>
                                        <code class="text-primary fw-semibold" th:text="${courier.consignmentNo}">—</code>
                                    </td>
                                    <td class="fw-semibold text-dark" th:text="${courier.shipperName}">Shipper</td>
                                    <td class="fw-semibold text-dark" th:text="${courier.receiverName}">Receiver</td>
                                    <td class="small text-muted-light" th:text="${courier.bookingDate}">2026-07-11</td>
                                    <td class="text-center">
                                        <!-- Custom Status Badges -->
                                        <span class="badge badge-modern" 
                                              th:classappend="${#strings.toLowerCase(courier.status) == 'delivered' || #strings.toLowerCase(courier.status) == 'completed' ? 'badge-modern-success' : 
                                                              (#strings.toLowerCase(courier.status) == 'in transit' || #strings.toLowerCase(courier.status) == 'shipped' ? 'badge-modern-warning' : 
                                                              (#strings.toLowerCase(courier.status) == 'delayed' ? 'badge-modern-danger' : 'badge-modern-primary'))}"
                                              th:text="${courier.status}">Status</span>
                                    </td>
                                    <td class="text-end">
                                        <div class="d-inline-flex gap-2">
                                            <a th:href="@{/couriers/{id}(id=${courier.id})}" class="btn btn-sm btn-light border rounded-3 p-2 text-info" title="View details">
                                                <i class="bi bi-eye"></i>
                                            </a>
                                            <a th:href="@{/couriers/{id}/edit(id=${courier.id})}" class="btn btn-sm btn-light border rounded-3 p-2 text-warning" title="Edit Shipment">
                                                <i class="bi bi-pencil"></i>
                                            </a>
                                            <a th:href="@{/tracking/update/{id}(id=${courier.id})}" class="btn btn-sm btn-light border rounded-3 p-2 text-primary" title="Update Status">
                                                <i class="bi bi-activity"></i>
                                            </a>
                                            
                                            <!-- Action Form: Deliver -->
                                            <form th:if="${#strings.toLowerCase(courier.status) != 'delivered' && #strings.toLowerCase(courier.status) != 'completed'}" 
                                                  th:action="@{/couriers/{id}/deliver(id=${courier.id})}" method="post" class="d-inline">
                                                <button type="submit" class="btn btn-sm btn-light border rounded-3 p-2 text-success" title="Mark as Delivered">
                                                    <i class="bi bi-check-lg"></i>
                                                </button>
                                            </form>

                                            <!-- Action Form: Delete -->
                                            <form th:action="@{/couriers/{id}/delete(id=${courier.id})}" method="post" class="d-inline" onsubmit="return confirm('Are you sure you want to delete this shipment?');">
                                                <button type="submit" class="btn btn-sm btn-light border rounded-3 p-2 text-danger" title="Delete">
                                                    <i class="bi bi-trash"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${couriers.empty}">
                                    <td colspan="7" class="text-center py-5 text-muted-light">
                                        <i class="bi bi-box-fill fs-1 d-block mb-2"></i>
                                        <span>No couriers found in the database.</span>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
