<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courier Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
    <h1>Courier Details</h1>
    <div class="row">
    <div class="col-lg-8">
    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title" th:text="${courier.consignmentNo}"></h5>
            <p><strong>Shipper:</strong> <span th:text="${courier.shipperName}"></span></p>
            <p><strong>Receiver:</strong> <span th:text="${courier.receiverName}"></span></p>
            <p><strong>Status:</strong> <span th:text="${courier.status}"></span></p>
            <p><strong>Booking Date:</strong> <span th:text="${courier.bookingDate}"></span></p>
            <p><strong>Comments:</strong> <span th:text="${courier.comments}"></span></p>
        </div>
    </div>

    <h2>Tracking History</h2>
    <table class="table table-bordered table-striped">
        <thead>
            <tr>
                <th>Date</th>
                <th>City</th>
                <th>Status</th>
                <th>Comments</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="track : ${trackingHistory}">
                <td th:text="${track.bookingTime}"></td>
                <td th:text="${track.currentCity}"></td>
                <td th:text="${track.status}"></td>
                <td th:text="${track.comments}"></td>
            </tr>
            <tr th:if="${trackingHistory.empty}">
                <td colspan="4" class="text-center">No tracking history available.</td>
            </tr>
        </tbody>
    </table>
        </div>
        <div class="col-lg-4">
            <div th:replace="~{fragments/qr-label :: qr-label(${courier.consignmentNo})}"></div>
        </div>
    </div>

    <div class="mt-4">
        <a th:href="@{/couriers/{id}/edit(id=${courier.id})}" class="btn btn-primary">Edit Shipment</a>
        <a th:href="@{/tracking/update/{id}(id=${courier.id})}" class="btn btn-warning">Update Status</a>
        <form th:action="@{/couriers/{id}/deliver(id=${courier.id})}" method="post" class="d-inline">
            <button type="submit" class="btn btn-success">Mark Delivered</button>
        </form>
        <a th:href="@{/track/q/{no}(no=${courier.consignmentNo})}" class="btn btn-info" target="_blank">Live Track (QR)</a>
        <a href="/couriers" class="btn btn-secondary">Back to List</a>
    </div>
</div>
</body>
</html>
