<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shipment Not Found</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5 text-center">
    <h1>Shipment Not Found</h1>
    <p class="text-muted">No package found for consignment <strong th:text="${consignmentNo}"></strong>.</p>
    <a th:href="@{/track-status}" class="btn btn-primary">Track by Number</a>
    <a href="/" class="btn btn-outline-secondary ms-2">Home</a>
</div>
</body>
</html>
