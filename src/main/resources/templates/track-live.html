<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Tracking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f6fb; }
        .status-badge { font-size: 1.1rem; }
        .timeline-item { border-left: 3px solid #0d6efd; padding-left: 1rem; margin-bottom: 1rem; }
        .pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>
<div class="container py-4" style="max-width: 480px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0">Package Tracking</h1>
        <span class="badge bg-success pulse" id="liveIndicator">Live</span>
    </div>
    <div class="card shadow-sm mb-3">
        <div class="card-body">
            <p class="text-muted small mb-1">Consignment</p>
            <h2 class="h5 text-primary" id="consignmentNo" th:text="${tracking.consignmentNo}">—</h2>
            <p class="mb-2">Status: <span class="badge bg-primary status-badge" id="status" th:text="${tracking.status}">—</span></p>
            <p class="mb-1"><strong>Current location:</strong> <span id="currentLocation" th:text="${tracking.currentLocation}">—</span></p>
            <p class="mb-1"><strong>Est. delivery:</strong> <span id="estimatedDelivery" th:text="${tracking.estimatedDelivery}">—</span></p>
            <p class="mb-0 text-muted small">Last updated: <span id="lastUpdated" th:text="${tracking.lastUpdated}">—</span></p>
        </div>
    </div>
    <div class="card shadow-sm mb-3">
        <div class="card-body">
            <p class="mb-1"><strong>From:</strong> <span id="shipperName" th:text="${tracking.shipperName}"></span></p>
            <p class="mb-0"><strong>To:</strong> <span id="receiverName" th:text="${tracking.receiverName}"></span></p>
            <p class="mb-0 mt-2 text-muted small">Mode: <span id="mode" th:text="${tracking.mode}"></span>
                · Pickup: <span id="pickUp" th:text="|${tracking.pickUpDate} ${tracking.pickUpTime}|"></span></p>
        </div>
    </div>
    <h2 class="h6">Tracking updates</h2>
    <div id="timeline" class="mb-3">
        <div th:each="event : ${tracking.events}" class="timeline-item">
            <div class="fw-semibold" th:text="${event.status}"></div>
            <div class="small text-muted" th:text="|${event.time} · ${event.location}|"></div>
            <div th:if="${event.comments}" class="small" th:text="${event.comments}"></div>
        </div>
        <p th:if="${tracking.events.empty}" class="text-muted small">No scan events yet.</p>
    </div>
    <p class="text-center text-muted small">Auto-refreshes every <span th:text="${refreshSeconds}">15</span>s ·
        <a th:href="@{/track-status}">Track by number</a></p>
</div>
<script th:inline="javascript">
    const consignmentNo = /*[[${tracking.consignmentNo}]]*/ '';
    const refreshSeconds = /*[[${refreshSeconds}]]*/ 15;
    function renderTimeline(events) {
        const el = document.getElementById('timeline');
        if (!events || events.length === 0) {
            el.innerHTML = '<p class="text-muted small">No scan events yet.</p>';
            return;
        }
        el.innerHTML = events.map(function(e) {
            var html = '<div class="timeline-item"><div class="fw-semibold">' + (e.status || '') + '</div>';
            html += '<div class="small text-muted">' + (e.time || '') + ' · ' + (e.location || '') + '</div>';
            if (e.comments) { html += '<div class="small">' + e.comments + '</div>'; }
            return html + '</div>';
        }).join('');
    }
    async function refresh() {
        try {
            const res = await fetch('/api/track/' + encodeURIComponent(consignmentNo));
            if (!res.ok) return;
            const data = await res.json();
            document.getElementById('status').textContent = data.status;
            document.getElementById('currentLocation').textContent = data.currentLocation;
            document.getElementById('estimatedDelivery').textContent = data.estimatedDelivery;
            document.getElementById('lastUpdated').textContent = data.lastUpdated;
            renderTimeline(data.events);
        } catch (err) {}
    }
    setInterval(refresh, refreshSeconds * 1000);
</script>
</body>
</html>
