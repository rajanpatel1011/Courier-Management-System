<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracking History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
    <h1>Tracking History</h1>
    <div th:if="${errorMessage}" class="alert alert-danger">
        <span th:text="${errorMessage}"></span>
    </div>
    <div th:if="${courier}">
        <div class="card mb-4">
            <div class="card-body">
                <h5 th:text="${courier.consignmentNo}"></h5>
                <p><strong>Status:</strong> <span th:text="${courier.status}"></span></p>
            </div>
        </div>
        <table class="table table-bordered table-striped">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>City</th>
                    <th>Status</th>
                    <th>Comments</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="track : ${trackingHistory}">
                    <td th:text="${track.bookingTime}"></td>
                    <td th:text="${track.currentCity}"></td>
                    <td th:text="${track.status}"></td>
                    <td th:text="${track.comments}"></td>
                </tr>
                <tr th:if="${trackingHistory.empty}">
                    <td colspan="4" class="text-center">No tracking history available.</td>
                </tr>
            </tbody>
        </table>
    </div>
    <a href="/couriers" class="btn btn-secondary">Back to Couriers</a>
</div>
</body>
</html>
