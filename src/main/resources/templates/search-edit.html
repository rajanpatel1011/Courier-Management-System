<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Courier</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
    <h1>Track Courier</h1>
    <form th:action="@{/couriers/track}" method="get">
        <div class="mb-3">
            <label for="consignmentNo" class="form-label">Consignment Number</label>
            <input type="text" class="form-control" id="consignmentNo" name="consignmentNo" required>
        </div>
        <button type="submit" class="btn btn-primary">Track</button>
    </form>
</div>
</body>
</html>
