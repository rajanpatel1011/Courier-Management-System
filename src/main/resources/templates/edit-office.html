<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Office</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
    <h1>Edit Office</h1>
    <form th:action="@{/offices/{id}/edit(id=${office.id})}" th:object="${office}" method="post">
        <div class="mb-3">
            <label class="form-label">Office Name</label>
            <input type="text" class="form-control" th:field="*{officeName}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Address</label>
            <textarea class="form-control" th:field="*{address}" required></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">City</label>
            <input type="text" class="form-control" th:field="*{city}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Phone</label>
            <input type="text" class="form-control" th:field="*{phoneNumber}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Office Timing</label>
            <input type="text" class="form-control" th:field="*{officeTiming}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Contact Person</label>
            <input type="text" class="form-control" th:field="*{contactPerson}" required>
        </div>
        <button type="submit" class="btn btn-primary">Save Changes</button>
    </form>
</div>
</body>
</html>
