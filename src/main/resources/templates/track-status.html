<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Status</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
    <h1>Track Courier Status</h1>
    <p class="text-muted">Enter your consignment number, or scan the QR code on your package label.</p>
    <form th:action="@{/couriers/track}" method="get" class="mb-4">
        <div class="mb-3">
            <label for="consignmentNo" class="form-label">Enter Consignment Number</label>
            <input type="text" class="form-control" id="consignmentNo" name="consignmentNo" required>
        </div>
        <button type="submit" class="btn btn-primary">Track Status</button>
    </form>
    <div class="alert alert-info small">
        <strong>Have a QR code?</strong> Scan it with your phone camera — it opens live tracking automatically.
    </div>
</div>
</body>
</html>
