<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/layout :: html-head('Track Shipment')}"></head>
<body class="bg-light d-flex flex-column" style="min-height: 100vh;">

    <!-- Navbar -->
    <nav th:replace="~{layout/layout :: navbar}"></nav>

    <!-- Main Container -->
    <div class="container py-5 my-auto" style="max-width: 600px;">
        <div class="glass-card p-4 p-md-5 border border-white border-opacity-60 bg-white shadow-lg">
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle p-3 mb-3" style="width: 60px; height: 60px;">
                    <i class="bi bi-compass-fill fs-3"></i>
                </div>
                <h1 class="h3 fw-bold text-dark mb-1">Track Courier Status</h1>
                <p class="text-muted small">Enter your consignment number below to view instant status and updates.</p>
            </div>

            <!-- Tracking Form -->
            <form th:action="@{/couriers/track}" method="get" class="mb-4">
                <div class="mb-4">
                    <label for="consignmentNo" class="form-label fw-semibold text-secondary small text-uppercase">Consignment Number</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 rounded-start-3"><i class="bi bi-hash text-muted"></i></span>
                        <input type="text" class="form-control form-control-modern border-start-0 rounded-end-3 py-3" id="consignmentNo" name="consignmentNo" placeholder="e.g. Q906F73L" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-modern btn-modern-primary w-100 py-3 rounded-3 fw-bold">
                    <i class="bi bi-search me-2"></i> Fetch Real-Time Status
                </button>
            </form>

            <!-- Info Box -->
            <div class="alert alert-info bg-info bg-opacity-10 text-info border-0 rounded-3 p-3 small d-flex gap-3 align-items-start">
                <i class="bi bi-qr-code-scan fs-4 mt-n1"></i>
                <div>
                    <h6 class="fw-bold mb-1 small text-info">Have a package label?</h6>
                    <span class="d-block text-muted-light">Scan the printed QR code using your smartphone's camera to launch the live tracking timeline instantly without manual entry.</span>
                </div>
            </div>
            
            <div class="text-center mt-4">
                <a href="/" class="small text-decoration-none text-muted-light hover-primary">
                    <i class="bi bi-arrow-left"></i> Back to Home
                </a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer th:replace="~{layout/layout :: footer}"></footer>

</body>
</html>
