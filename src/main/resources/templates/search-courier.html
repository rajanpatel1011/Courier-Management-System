<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Courier</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
    <h1>Search Courier</h1>
    <form class="row g-3 mb-4" th:action="@{/couriers/search}" method="get">
        <div class="col-md-4">
            <select name="type" class="form-select">
                <option value="consignment" th:selected="${searchType} == 'consignment'">Consignment No</option>
                <option value="shipper" th:selected="${searchType} == 'shipper'">Shipper Name</option>
                <option value="receiver" th:selected="${searchType} == 'receiver'">Receiver Name</option>
            </select>
        </div>
        <div class="col-md-6">
            <input type="text" class="form-control" name="query" th:value="${searchQuery}" placeholder="Enter search query" required>
        </div>
        <div class="col-md-2">
            <button type="submit" class="btn btn-primary w-100">Search</button>
        </div>
    </form>

    <table class="table table-bordered table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Consignment No</th>
            <th>Shipper</th>
            <th>Receiver</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="courier : ${couriers}">
            <td th:text="${courier.id}"></td>
            <td th:text="${courier.consignmentNo}"></td>
            <td th:text="${courier.shipperName}"></td>
            <td th:text="${courier.receiverName}"></td>
            <td th:text="${courier.status}"></td>
            <td>
                <a th:href="@{/couriers/{id}(id=${courier.id})}" class="btn btn-sm btn-info">View</a>
            </td>
        </tr>
        <tr th:if="${couriers.empty}">
            <td colspan="6" class="text-center">No couriers found.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
