<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Courier</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
    <h1>Add Courier</h1>
    <form th:action="@{/couriers/add}" th:object="${courier}" method="post">
        <div class="mb-3">
            <label class="form-label">Consignment No</label>
            <input type="text" class="form-control" th:field="*{consignmentNo}" placeholder="Leave blank to auto-generate">
        </div>
        <div class="mb-3">
            <label class="form-label">Shipper Name</label>
            <input type="text" class="form-control" th:field="*{shipperName}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Shipper Phone</label>
            <input type="text" class="form-control" th:field="*{shipperPhone}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Shipper Address</label>
            <textarea class="form-control" th:field="*{shipperAddress}" required></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Receiver Name</label>
            <input type="text" class="form-control" th:field="*{receiverName}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Receiver Phone</label>
            <input type="text" class="form-control" th:field="*{receiverPhone}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Receiver Address</label>
            <textarea class="form-control" th:field="*{receiverAddress}" required></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Type</label>
            <input type="text" class="form-control" th:field="*{type}" required>
        </div>
        <div class="mb-3 row">
            <div class="col-md-6">
                <label class="form-label">Weight</label>
                <input type="number" step="0.1" class="form-control" th:field="*{weight}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Quantity</label>
                <input type="number" class="form-control" th:field="*{quantity}" required>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Invoice No</label>
            <input type="text" class="form-control" th:field="*{invoiceNo}" required>
        </div>
        <div class="mb-3 row">
            <div class="col-md-6">
                <label class="form-label">Booking Mode</label>
                <input type="text" class="form-control" th:field="*{bookingMode}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Mode</label>
                <input type="text" class="form-control" th:field="*{mode}" required>
            </div>
        </div>
        <div class="mb-3 row">
            <div class="col-md-6">
                <label class="form-label">Pick Up Date</label>
                <input type="date" class="form-control" th:field="*{pickUpDate}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Pick Up Time</label>
                <input type="text" class="form-control" th:field="*{pickUpTime}" required>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Status</label>
            <input type="text" class="form-control" th:field="*{status}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Comments</label>
            <textarea class="form-control" th:field="*{comments}"></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Booking Date</label>
            <input type="date" class="form-control" th:field="*{bookingDate}" required>
        </div>
        <button type="submit" class="btn btn-primary">Create Courier</button>
    </form>
</div>
</body>
</html>
