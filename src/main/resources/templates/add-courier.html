<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/layout :: html-head('Add Courier')}"></head>
<body class="bg-light">

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar Navigation -->
            <div th:replace="~{layout/layout :: sidebar('add-courier')}"></div>

            <!-- Main Panel Content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 main-content">
                <!-- Top Header Fragment -->
                <div th:replace="~{layout/layout :: admin-header(${session.user_name}, ${session.user_type})}"></div>

                <!-- Page Header Title -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h3 class="fw-bold text-dark mb-1">Create New Courier</h3>
                        <p class="text-muted small mb-0">Book a new shipment package into the system</p>
                    </div>
                    <a href="/couriers" class="btn btn-modern btn-modern-secondary py-2">
                        <i class="bi bi-arrow-left me-1"></i> Back to List
                    </a>
                </div>

                <!-- Add Form Wrap -->
                <form th:action="@{/couriers/add}" th:object="${courier}" method="post">
                    
                    <div class="row g-4">
                        <!-- Left Column: Shipper & Receiver -->
                        <div class="col-lg-6">
                            <!-- Shipper Section -->
                            <div class="glass-card p-4 border border-white border-opacity-60 bg-white shadow-sm mb-4">
                                <h5 class="fw-bold mb-3 text-dark d-flex align-items-center">
                                    <i class="bi bi-person-up text-primary me-2"></i> Shipper Details
                                </h5>
                                
                                <div class="mb-3">
                                    <label class="form-label text-secondary small fw-semibold text-uppercase">Shipper Name</label>
                                    <input type="text" class="form-control form-control-modern" th:field="*{shipperName}" placeholder="e.g. John Doe" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label text-secondary small fw-semibold text-uppercase">Shipper Phone</label>
                                    <input type="text" class="form-control form-control-modern" th:field="*{shipperPhone}" placeholder="e.g. +1 555-0199" required>
                                </div>
                                <div class="mb-0">
                                    <label class="form-label text-secondary small fw-semibold text-uppercase">Shipper Address</label>
                                    <textarea class="form-control form-control-modern" th:field="*{shipperAddress}" rows="3" placeholder="Enter complete pickup address" required></textarea>
                                </div>
                            </div>

                            <!-- Receiver Section -->
                            <div class="glass-card p-4 border border-white border-opacity-60 bg-white shadow-sm">
                                <h5 class="fw-bold mb-3 text-dark d-flex align-items-center">
                                    <i class="bi bi-person-down text-success me-2"></i> Receiver Details
                                </h5>
                                
                                <div class="mb-3">
                                    <label class="form-label text-secondary small fw-semibold text-uppercase">Receiver Name</label>
                                    <input type="text" class="form-control form-control-modern" th:field="*{receiverName}" placeholder="e.g. Jane Smith" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label text-secondary small fw-semibold text-uppercase">Receiver Phone</label>
                                    <input type="text" class="form-control form-control-modern" th:field="*{receiverPhone}" placeholder="e.g. +1 555-0188" required>
                                </div>
                                <div class="mb-0">
                                    <label class="form-label text-secondary small fw-semibold text-uppercase">Receiver Address</label>
                                    <textarea class="form-control form-control-modern" th:field="*{receiverAddress}" rows="3" placeholder="Enter complete delivery destination address" required></textarea>
                                </div>
                            </div>
                        </div>

                        <!-- Right Column: Package Specs & Logistics -->
                        <div class="col-lg-6">
                            <!-- Package specs -->
                            <div class="glass-card p-4 border border-white border-opacity-60 bg-white shadow-sm mb-4">
                                <h5 class="fw-bold mb-3 text-dark d-flex align-items-center">
                                    <i class="bi bi-box-seam text-info me-2"></i> Package Specifications
                                </h5>
                                
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label text-secondary small fw-semibold text-uppercase">Package Type</label>
                                        <input type="text" class="form-control form-control-modern" th:field="*{type}" placeholder="e.g. Parcel, Document" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label text-secondary small fw-semibold text-uppercase">Invoice Number</label>
                                        <input type="text" class="form-control form-control-modern" th:field="*{invoiceNo}" placeholder="e.g. INV-10023" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label text-secondary small fw-semibold text-uppercase">Weight (kg)</label>
                                        <input type="number" step="0.1" class="form-control form-control-modern" th:field="*{weight}" placeholder="0.0" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label text-secondary small fw-semibold text-uppercase">Quantity</label>
                                        <input type="number" class="form-control form-control-modern" th:field="*{quantity}" placeholder="1" required>
                                    </div>
                                </div>
                            </div>

                            <!-- Logistics Details -->
                            <div class="glass-card p-4 border border-white border-opacity-60 bg-white shadow-sm">
                                <h5 class="fw-bold mb-3 text-dark d-flex align-items-center">
                                    <i class="bi bi-truck text-warning me-2"></i> Logistics &amp; Scheduling
                                </h5>
                                
                                <div class="row g-3 mb-3">
                                    <div class="col-md-6">
                                        <label class="form-label text-secondary small fw-semibold text-uppercase">Consignment No</label>
                                        <input type="text" class="form-control form-control-modern" th:field="*{consignmentNo}" placeholder="Auto-generate if empty">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label text-secondary small fw-semibold text-uppercase">Status</label>
                                        <input type="text" class="form-control form-control-modern" th:field="*{status}" placeholder="e.g. Booked, In Transit" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label text-secondary small fw-semibold text-uppercase">Booking Mode</label>
                                        <input type="text" class="form-control form-control-modern" th:field="*{bookingMode}" placeholder="e.g. Paid, ToPay" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label text-secondary small fw-semibold text-uppercase">Transit Mode</label>
                                        <input type="text" class="form-control form-control-modern" th:field="*{mode}" placeholder="e.g. Road, Air, Train" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label text-secondary small fw-semibold text-uppercase">Pick Up Date</label>
                                        <input type="date" class="form-control form-control-modern" th:field="*{pickUpDate}" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label text-secondary small fw-semibold text-uppercase">Pick Up Time</label>
                                        <input type="text" class="form-control form-control-modern" th:field="*{pickUpTime}" placeholder="e.g. 10:00 AM" required>
                                    </div>
                                    <div class="col-md-12">
                                        <label class="form-label text-secondary small fw-semibold text-uppercase">Booking Date</label>
                                        <input type="date" class="form-control form-control-modern" th:field="*{bookingDate}" required>
                                    </div>
                                </div>
                                
                                <div class="mb-0">
                                    <label class="form-label text-secondary small fw-semibold text-uppercase">Staff Comments</label>
                                    <textarea class="form-control form-control-modern" th:field="*{comments}" rows="2" placeholder="Internal remarks or delivery notes"></textarea>
                                </div>
                            </div>
                        </div>

                        <!-- Action Submit Bar -->
                        <div class="col-12 text-end mb-5">
                            <button type="submit" class="btn btn-modern btn-modern-primary py-3 px-5 fw-bold fs-6">
                                <i class="bi bi-check-circle me-1"></i> Register Courier Shipment
                            </button>
                        </div>
                    </div>

                </form>
            </main>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
