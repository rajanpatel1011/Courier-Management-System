<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courier Added</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
    <div class="alert alert-success" th:if="${successMessage}">
        <span th:text="${successMessage}"></span>
    </div>
    <h1>Courier Added Successfully</h1>

    <div th:if="${consignmentNo}" class="row mt-4">
        <div class="col-md-6">
            <div th:replace="~{fragments/qr-label :: qr-label(${consignmentNo})}"></div>
            <p class="small text-muted mt-2">Print this QR on the label or share the link with the customer.</p>
        </div>
        </div>

    <div class="mt-4">
        <a href="/couriers" class="btn btn-primary">View Couriers</a>
        <a href="/couriers/add" class="btn btn-secondary">Add Another</a>
        <a th:if="${consignmentNo}" th:href="@{/track/q/{no}(no=${consignmentNo})}" class="btn btn-outline-info" target="_blank">Preview Live Track</a>
    </div>
</div>
</body>
</html>
