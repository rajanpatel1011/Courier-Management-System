<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
    <h1>Reports</h1>
    <div class="row mt-4">
        <div class="col-md-6 mb-3">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Datewise Report</h5>
                    <p class="card-text">Review shipments grouped by booking date and edit pending couriers.</p>
                    <a class="btn btn-primary" th:href="@{/reports/datewise}">View Datewise Report</a>
                </div>
            </div>
        </div>
        <div class="col-md-6 mb-3">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Delivered Report</h5>
                    <p class="card-text">View all delivered shipments in the system.</p>
                    <a class="btn btn-primary" th:href="@{/couriers/delivered}">View Delivered Report</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
