<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search &amp; Edit Courier</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
    <h1>Search &amp; Edit Courier</h1>
    <p class="text-muted">Enter a consignment number to open the shipment for editing.</p>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <form th:action="@{/search-edit}" method="post" class="col-md-6">
        <div class="mb-3">
            <label for="consignmentNo" class="form-label">Consignment Number</label>
            <input type="text" class="form-control" id="consignmentNo" name="consignmentNo" required>
        </div>
        <button type="submit" class="btn btn-primary">Find &amp; Edit</button>
        <a href="/couriers/search" class="btn btn-outline-secondary ms-2">Advanced Search</a>
    </form>
</div>
</body>
</html>
