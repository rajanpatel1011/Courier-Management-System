<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Courier Officer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
    <h1>Add Courier Officer</h1>
    <div th:if="${errorMessage}" class="alert alert-danger">
        <span th:text="${errorMessage}"></span>
    </div>
    <form th:action="@{/officers/add}" th:object="${officer}" method="post">
        <div class="mb-3">
            <label class="form-label">Officer Name</label>
            <input type="text" class="form-control" th:field="*{officerName}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" th:field="*{password}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Address</label>
            <textarea class="form-control" th:field="*{address}" required></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" th:field="*{email}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Phone Number</label>
            <input type="text" class="form-control" th:field="*{phoneNumber}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Office</label>
            <select class="form-control" th:field="*{office}" required>
                <option value="">Select Office</option>
                <option th:each="office : ${offices}" th:value="${office.officeName}" th:text="${office.officeName}"></option>
            </select>
        </div>
        <button type="submit" class="btn btn-success">Add Officer</button>
    </form>
</div>
</body>
</html>
