<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datewise Courier Report</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
    <h1>Datewise Courier Report</h1>
    <p class="mb-4">Showing all shipments that have not yet been delivered. Click edit to update shipment details.</p>
    <table class="table table-bordered table-striped">
        <thead>
            <tr>
                <th>ID</th>
                <th>Consignment No</th>
                <th>Shipper</th>
                <th>Receiver</th>
                <th>Pickup Date/Time</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="courier : ${couriers}">
                <td th:text="${courier.id}"></td>
                <td th:text="${courier.consignmentNo}"></td>
                <td th:text="${courier.shipperName}"></td>
                <td th:text="${courier.receiverName}"></td>
                <td><span th:text="${courier.pickUpDate}"></span> / <span th:text="${courier.pickUpTime}"></span></td>
                <td th:text="${courier.status}"></td>
                <td>
                    <a th:href="@{/couriers/{id}/edit(id=${courier.id})}" class="btn btn-sm btn-primary">Edit</a>
                </td>
            </tr>
            <tr th:if="${couriers.empty}">
                <td colspan="7" class="text-center">No pending shipments found.</td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
