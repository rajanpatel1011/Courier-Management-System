<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Officers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Courier Officers</h1>
        <a href="/officers/add" class="btn btn-success">Add Officer</a>
    </div>

    <table class="table table-bordered table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Office</th>
            <th>Phone</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="officer : ${officers}">
            <td th:text="${officer.id}"></td>
            <td th:text="${officer.officerName}"></td>
            <td th:text="${officer.email}"></td>
            <td th:text="${officer.office}"></td>
            <td th:text="${officer.phoneNumber}"></td>
            <td>
                <a th:href="@{/officers/{id}(id=${officer.id})}" class="btn btn-sm btn-info">View</a>
                <a th:href="@{/officers/{id}/edit(id=${officer.id})}" class="btn btn-sm btn-secondary">Edit</a>
                <form th:action="@{/officers/{id}/delete(id=${officer.id})}" method="post" style="display:inline-block;">
                    <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                </form>
            </td>
        </tr>
        <tr th:if="${officers.empty}">
            <td colspan="6" class="text-center">No courier officers found.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
