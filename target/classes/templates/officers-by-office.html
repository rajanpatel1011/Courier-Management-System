<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Officers by Office</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
    <h1>Officers in <span th:text="${office}"></span></h1>
    <table class="table table-bordered table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="officer : ${officers}">
            <td th:text="${officer.id}"></td>
            <td th:text="${officer.officerName}"></td>
            <td th:text="${officer.email}"></td>
            <td th:text="${officer.phoneNumber}"></td>
        </tr>
        <tr th:if="${officers.empty}">
            <td colspan="4" class="text-center">No officers found for this office.</td>
        </tr>
        </tbody>
    </table>
    <a href="/officers" class="btn btn-secondary">Back to Officers</a>
</div>
</body>
</html>
