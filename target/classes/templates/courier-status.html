<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Status</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
    <h1>Update Courier Status</h1>
    <div th:if="${successMessage}" class="alert alert-success">
        <span th:text="${successMessage}"></span>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger">
        <span th:text="${errorMessage}"></span>
    </div>
    <form th:action="@{/tracking/update}" th:object="${track}" method="post">
        <input type="hidden" th:field="*{courierId}" />
        <input type="hidden" th:field="*{consignmentNo}" />
        <div class="mb-3">
            <label class="form-label">Courier ID</label>
            <input type="text" class="form-control" th:value="${track.courierId}" disabled>
        </div>
        <div class="mb-3">
            <label class="form-label">Consignment No</label>
            <input type="text" class="form-control" th:value="${track.consignmentNo}" disabled>
        </div>
        <div class="mb-3">
            <label class="form-label">Current City</label>
            <select class="form-control" th:field="*{currentCity}" required>
                <option th:each="office : ${offices}" th:value="${office.officeName}" th:text="${office.officeName}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Status</label>
            <input type="text" class="form-control" th:field="*{status}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Comments</label>
            <textarea class="form-control" th:field="*{comments}"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Update Status</button>
    </form>
</div>
</body>
</html>
