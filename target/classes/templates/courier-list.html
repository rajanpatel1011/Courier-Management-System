<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Couriers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Couriers</h1>
        <a href="/couriers/add" class="btn btn-primary">Add Courier</a>
    </div>

    <table class="table table-bordered table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Consignment No</th>
            <th>Shipper</th>
            <th>Receiver</th>
            <th>Status</th>
            <th>Booking Date</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="courier : ${couriers}">
            <td th:text="${courier.id}"></td>
            <td th:text="${courier.consignmentNo}"></td>
            <td th:text="${courier.shipperName}"></td>
            <td th:text="${courier.receiverName}"></td>
            <td th:text="${courier.status}"></td>
            <td th:text="${courier.bookingDate}"></td>
            <td>
                <a th:href="@{/couriers/{id}(id=${courier.id})}" class="btn btn-sm btn-info">View</a>
                <a th:href="@{/couriers/{id}/edit(id=${courier.id})}" class="btn btn-sm btn-secondary">Edit</a>
                <a th:href="@{/tracking/update/{id}(id=${courier.id})}" class="btn btn-sm btn-warning">Status</a>
                <form th:action="@{/couriers/{id}/deliver(id=${courier.id})}" method="post" style="display:inline-block;">
                    <button type="submit" class="btn btn-sm btn-success">Deliver</button>
                </form>
                <form th:action="@{/couriers/{id}/delete(id=${courier.id})}" method="post" style="display:inline-block;">
                    <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                </form>
            </td>
        </tr>
        <tr th:if="${couriers.empty}">
            <td colspan="7" class="text-center">No couriers found.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
