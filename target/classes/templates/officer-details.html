<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Officer Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
    <h1>Officer Details</h1>
    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title" th:text="${officer.officerName}"></h5>
            <p><strong>Email:</strong> <span th:text="${officer.email}"></span></p>
            <p><strong>Phone:</strong> <span th:text="${officer.phoneNumber}"></span></p>
            <p><strong>Office:</strong> <span th:text="${officer.office}"></span></p>
            <p><strong>Address:</strong> <span th:text="${officer.address}"></span></p>
            <p><strong>Registered At:</strong> <span th:text="${officer.registrationDate}"></span></p>
        </div>
    </div>
    <a href="/officers" class="btn btn-secondary">Back to Officers</a>
</div>
</body>
</html>
