<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Courier</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
    <h1>Edit Courier</h1>
    <form th:action="@{/couriers/{id}/edit(id=${courier.id})}" th:object="${courier}" method="post">
        <div class="mb-3">
            <label class="form-label">Consignment No</label>
            <input type="text" class="form-control" th:field="*{consignmentNo}" readonly>
        </div>
        <div class="mb-3">
            <label class="form-label">Shipper Name</label>
            <input type="text" class="form-control" th:field="*{shipperName}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Receiver Name</label>
            <input type="text" class="form-control" th:field="*{receiverName}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Status</label>
            <input type="text" class="form-control" th:field="*{status}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Comments</label>
            <textarea class="form-control" th:field="*{comments}"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Save Changes</button>
    </form>
</div>
</body>
</html>
